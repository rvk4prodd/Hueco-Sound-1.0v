name: Build Android APK

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Hueco Sound Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install pnpm 10.28.2
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild Native Android Code
        run: npx expo prebuild --platform android --clean

      - name: Bundle JavaScript & Assets for Standalone Release
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed \
            --platform android \
            --dev false \
            --entry-file index.ts \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Build Standalone Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK File
        run: |
          mkdir -p output
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk output/HuecoSound.apk
          elif ls android/app/build/outputs/apk/release/*-release.apk 1> /dev/null 2>&1; then
            cp android/app/build/outputs/apk/release/*-release.apk output/HuecoSound.apk
          else
            echo "ERRO: O APK standalone de Release nao foi encontrado!"
            ls -laR android/app/build/outputs/apk
            exit 1
          fi
          echo "APK standalone compilado com sucesso:"
          ls -lh output/HuecoSound.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HuecoSound-APK
          path: output/HuecoSound.apk

      - name: Release APK on GitHub
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        with:
          files: output/HuecoSound.apk
          tag_name: ${{ github.ref_name || format('v1.2.0-build-{0}', github.run_number) }}
          name: Hueco Sound v1.2.0 (Build #${{ github.run_number }})
          body: |
            ### 🎵 Hueco Sound APK - Download Direto
            
            - **Versão:** 1.2.0 (Release Standalone)
            - **Build:** #${{ github.run_number }}
            - **Novidades desta atualização:**
              - **Correção definitiva do crash "Unable to load script":** JavaScript compilado com Hermes e embutido 100% offline direto no APK (não requer Metro nem Wi-Fi).
              - **Mixagem / Crossfade estilo Spotify:** Transições suaves entre as músicas com tempo ajustável (1s a 8s) e curva suave (DJ).
              - **Interface inspirada no Spotify:** Layout otimizado com atalhos diretos para Letras, Temporizador e Fila, além do card expansível de letras.
              - **Busca destravada:** Suporte a prévias de artistas, snippets, vazamentos, remixes e busca direta no catálogo do SoundCloud.
          draft: false
          prerelease: false

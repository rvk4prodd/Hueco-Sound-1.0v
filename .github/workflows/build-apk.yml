name: Build Android APK

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Hueco Sound Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm 10.28.2
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Build Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild Native Android Code
        run: npx expo prebuild --platform android --clean

      - name: Bundle JavaScript & Assets for Standalone Release
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed \
            --platform android \
            --dev false \
            --entry-file index.ts \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Build Standalone Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --build-cache --parallel --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"

      - name: Prepare APK File
        run: |
          mkdir -p output
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk output/HuecoSound.apk
          elif ls android/app/build/outputs/apk/release/*-release.apk 1> /dev/null 2>&1; then
            cp android/app/build/outputs/apk/release/*-release.apk output/HuecoSound.apk
          else
            echo "ERRO: O APK standalone de Release nao foi encontrado!"
            ls -laR android/app/build/outputs/apk
            exit 1
          fi
          echo "APK standalone compilado com sucesso:"
          ls -lh output/HuecoSound.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HuecoSound-APK
          path: output/HuecoSound.apk

      - name: Release APK on GitHub
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        with:
          files: output/HuecoSound.apk
          tag_name: ${{ github.ref_name || format('v1.3.0-build-{0}', github.run_number) }}
          name: Hueco Sound v1.3.0 (Build #${{ github.run_number }})
          body: |
            ### 🎵 Hueco Sound APK v1.3.0 - Download Direto

            - **Versão:** 1.3.0 (Release Standalone)
            - **Build:** #${{ github.run_number }}
            - **Novidades desta grande atualização:**
              - **Fim da 'Paradinha' / Gapless Nativo Perfeito:** Reprodução 100% contínua e sem interrupções entre as músicas da fila ou repetição de playlist.
              - **Estúdio de Mixagem Estilo Spotify (`[🎚️ Mix]`):** Disponível em qualquer playlist! Personalize transições entre cada par de faixas com onda dupla (dual waveform), curvas de volume (Crossfade, Sobrepor, Corte rápido), troca de graves EQ (No centro, No final, Planos), e efeitos (Eco/Delay, Filtro passa-baixa, Reverberação).
              - **Download de Playlist Completa Offline:** Baixe todas as faixas de qualquer playlist de uma vez com um toque para ouvir offline em "Neste celular", com indicador de progresso.
              - **Personalização Visual Total & Efeito Glass:** Suporte a planos de fundo com temas vibrantes (Cyberpunk Neon, Noite Estrelada, Aurora Glass) ou escolha sua própria foto da galeria com efeito translúcido de vidro e controle de desfoque.
              - **Build Ultra-Rápido no GitHub Actions:** Caching de Gradle e compilação paralela para gerar novos APKs com tempo de espera reduzido.
          draft: false
          prerelease: false

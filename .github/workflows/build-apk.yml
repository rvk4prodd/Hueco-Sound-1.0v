name: Build Android APK

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Hueco Sound Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm 10.28.2
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Build Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate TypeScript, lint and regression tests
        run: pnpm check

      - name: Check Expo dependency compatibility
        run: pnpm exec expo install --check

      - name: Prebuild Native Android Code
        run: npx expo prebuild --platform android --clean

      - name: Verify native audio effects
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :expo-audio:testDebugUnitTest --tests expo.modules.audio.HuecoDspTest --no-daemon

      - name: Build Standalone Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --build-cache --parallel --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"

      - name: Prepare APK File
        run: |
          mkdir -p output
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk output/HuecoSound.apk
          elif ls android/app/build/outputs/apk/release/*-release.apk 1> /dev/null 2>&1; then
            cp android/app/build/outputs/apk/release/*-release.apk output/HuecoSound.apk
          else
            echo "ERRO: O APK standalone de Release nao foi encontrado!"
            ls -laR android/app/build/outputs/apk
            exit 1
          fi
          echo "APK standalone compilado com sucesso:"
          ls -lh output/HuecoSound.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HuecoSound-APK
          path: output/HuecoSound.apk

      - name: Release APK on GitHub
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          files: output/HuecoSound.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.3.3-build-{0}', github.run_number) }}
          name: Hueco Sound v1.3.3 (Build #${{ github.run_number }})
          body: |
            Hueco Sound 1.3.3 — correções de reprodução, transições, efeitos Android e temas.
            Instalador gerado a partir do commit ${{ github.sha }}.
            Confirme reprodução, notificações e Bluetooth no seu aparelho.
          draft: false
          prerelease: false

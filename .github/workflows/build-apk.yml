name: Build Android APK

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Hueco Sound Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm 10.28.2
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Build Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild Native Android Code
        run: npx expo prebuild --platform android --clean

      - name: Bundle JavaScript & Assets for Standalone Release
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed \
            --platform android \
            --dev false \
            --entry-file index.ts \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Build Standalone Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --build-cache --parallel --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"

      - name: Prepare APK File
        run: |
          mkdir -p output
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk output/HuecoSound.apk
          elif ls android/app/build/outputs/apk/release/*-release.apk 1> /dev/null 2>&1; then
            cp android/app/build/outputs/apk/release/*-release.apk output/HuecoSound.apk
          else
            echo "ERRO: O APK standalone de Release nao foi encontrado!"
            ls -laR android/app/build/outputs/apk
            exit 1
          fi
          echo "APK standalone compilado com sucesso:"
          ls -lh output/HuecoSound.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HuecoSound-APK
          path: output/HuecoSound.apk

      - name: Release APK on GitHub
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          files: output/HuecoSound.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.3.1-build-{0}', github.run_number) }}
          name: Hueco Sound v1.3.1 (Build #${{ github.run_number }})
          body: |
            ### 🎵 Hueco Sound APK v1.3.1 - Download Direto

            - **Versão:** 1.3.1 (Release Standalone)
            - **Build:** #${{ github.run_number }}
            - **Novidades desta grande atualização:**
              - **Estúdio de Mixagem Estilo Spotify Completo em Mobile:** Formas de onda com frequências coloridas, o quadradinho arrastável dinâmico com segundos exatos em tempo real. A música de saída (A) inicia no final dela (arraste para a esquerda para voltar no tempo), e a de entrada (B) inicia no início dela (arraste para a direita para avançar). Ajuste fino por botões `−` e `+`.
              - **Pontes de Transição nas Playlists:** Link interativo entre cada música da playlist (`[ 4s • AUTOMIX Mix ]`) abrindo diretamente o editor de transição entre as duas faixas.
              - **Notificação Nativa Samsung One UI & Suporte a Fones Bluetooth:**
                - Integração com Media3 `MediaSessionService` e `MediaStyle` nativa do Android para o reprodutor Samsung One UI na central de notificações e tela de bloqueio.
                - Suporte a comandos de fone de ouvido Bluetooth (AVRCP): passar música, voltar música, pausar e retomar.
                - Permissões completas de `POST_NOTIFICATIONS`, `FOREGROUND_SERVICE_MEDIA_PLAYBACK` e Bluetooth.
              - **Gapless Nativo & Downloads Offline:** Reprodução 100% contínua e download completo de playlists para ouvir em qualquer lugar sem internet.
          draft: false
          prerelease: false
